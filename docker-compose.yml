# ============================================================
# Entorno local completo: aplicación + MySQL
#
#   docker compose up --build
#   App:  http://localhost:8080/public/index.php
#   Login: admin@crud.com / admin12345
#
# La primera vez MySQL ejecuta database/schema.sql automáticamente.
# Para reiniciar la base desde cero:  docker compose down -v
# ============================================================
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: crud_usuarios
      DB_USERNAME: estudiante
      DB_PASSWORD: Developer123
      DB_CHARSET: utf8mb4
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: crud_usuarios
      MYSQL_USER: estudiante
      MYSQL_PASSWORD: Developer123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
