# ============================================================
# Integración y despliegue continuo
#
#  1. lint:   revisa la sintaxis de todos los archivos PHP.
#  2. smoke:  levanta MySQL, carga database/schema.sql, arranca la
#             aplicación y ejecuta la prueba de humo del CRUDL.
#  3. deploy: solo en push a main. Llama al "deploy hook" del servicio
#             en la nube (por ejemplo Render). Se activa creando el secreto
#             RENDER_DEPLOY_HOOK_URL en Settings > Secrets and variables >
#             Actions; si el secreto no existe, el paso se omite.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring

      - name: Revisar sintaxis de los archivos PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n 1 php -l > /dev/null

  smoke:
    name: Prueba de humo del CRUDL
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: crud_usuarios
      DB_USERNAME: root
      DB_PASSWORD: root123
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring

      - name: Crear la base de datos
        run: mysql -h 127.0.0.1 -uroot -proot123 < database/schema.sql

      - name: Arrancar la aplicación
        run: |
          php -S 127.0.0.1:8080 -t . > php-server.log 2>&1 &
          sleep 3

      - name: Ejecutar la prueba de humo
        run: BASE_URL=http://127.0.0.1:8080/public/index.php bash tests/smoke.sh

      - name: Mostrar el log del servidor si algo falla
        if: failure()
        run: cat php-server.log

  deploy:
    name: Despliegue
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Llamar al deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No hay secreto RENDER_DEPLOY_HOOK_URL: se omite el despliegue."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Despliegue solicitado."
